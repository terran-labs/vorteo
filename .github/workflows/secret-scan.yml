name: Secret scan

on:
  # Vorteo: pull requests, merge groups and main pushes scan only the commits they add;
  # the nightly and manual runs scan all reachable history. Branch pushes are scanned
  # again on their pull request, so they no longer run a separate scan.
  push:
    branches: [main]
  pull_request:
  # scan is a required check, so the merge queue needs it on each merge group.
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Choose the history to scan
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            merge_group) range="$QUEUE_BASE..$QUEUE_HEAD" ;;
            push)
              # A first push has no previous commit; scan everything reachable.
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                range="--all --full-history"
              else
                range="$PUSH_BEFORE..$GITHUB_SHA"
              fi ;;
            *) range="--all --full-history" ;;
          esac
          echo "Scanning: $range"
          echo "log_opts=$range" >> "$GITHUB_OUTPUT"
      - name: Scan history
        env:
          SECRET_SCAN_LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: npm run security:secrets
