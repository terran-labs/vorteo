name: Container

# Vorteo: container builds left pull request CI, where both architecture smokes
# held runners from the required checks. They run after merge and on demand.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker.yml"
      - ".dockerignore"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "skills/**"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "packages/app/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/expo-two-way-audio/**"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/relay/**"
      - "packages/server/**"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every Vorteo commit bumps the version in each manifest, which matches the trigger's
  # package paths on every push. Route on the substantive diff instead, as CI does.
  changes:
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ignore version-only manifest bumps
        if: ${{ github.event_name == 'push' }}
        run: node scripts/ci-neutralize-version-bumps.mjs "${{ github.event.before }}"
      - name: Detect container changes
        id: filter
        if: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          base: ${{ github.event.before }}
          # An empty token diffs the local routing commit, not the API's file list.
          token: ""
          filters: |
            container:
            - ".github/workflows/docker.yml"
            - ".dockerignore"
            - "docker/**"
            - "package.json"
            - "package-lock.json"
            - "patches/**"
            - "scripts/**"
            - "skills/**"
            - "tsconfig.json"
            - "tsconfig.base.json"
            - "packages/app/**"
            - "packages/cli/**"
            - "packages/client/**"
            - "packages/expo-two-way-audio/**"
            - "packages/highlight/**"
            - "packages/plugin/**"
            - "packages/protocol/**"
            - "packages/relay/**"
            - "packages/server/**"

  verify:
    needs: changes
    # Manual runs always build; missing outputs fail open to building.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.container != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check container runtime and installation
        run: |
          python3 -B docker/multiplex/test_install.py
          python3 -B docker/tailscale/test_network.py
          python3 -B docker/tailscale/test_launch_agent.py
          python3 -B docker/tailscale/test_https_broker.py
          python3 -B docker/tailscale/test_host_recovery.py
          python3 -B docker/tailscale/test_host_config.py
          python3 -B docker/private-domain/native/test_native_gateway.py
          python3 -B docker/private-domain/native/test_hosted_app.py
          python3 -B docker/tailscale/test_scratch_reaper.py
          node --test docker/tailscale/initialize-web.test.mjs docker/base/server-entry.test.mjs
          bash -n docker/multiplex/install.sh docker/multiplex/connect.sh docker/multiplex/update.sh docker/multiplex/common.sh docker/tailscale/entrypoint docker/tailscale/start-paseo
      - name: Validate the single Compose recipe
        env:
          PASEO_IMAGE: paseo-container:check
          PASEO_INSTANCE: ci-check
          PASEO_PASSWORD: ci-disposable-password
        run: docker compose -f docker/multiplex/compose.yaml config --quiet

  smoke:
    needs: verify
    # Each architecture builds on its own runner. arm64 used QEMU on x86 and took
    # about 26.5 minutes against 20.9 for amd64; GitHub's arm64 runners are free for public repositories.
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      # The image exists twice once loaded (buildx cache and the Docker
      # daemon), and the smoke copies the web UI inside it. That exhausted the
      # runner disk once (ENOSPC in smoke), so drop preinstalled SDKs the job
      # never uses and record the space left.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          build-args: PASEO_BUILD_COMMIT=${{ github.sha }}
          platforms: linux/${{ matrix.architecture }}
          tags: paseo-container:check
          load: true
          provenance: false
          cache-from: type=gha,scope=multiplex-${{ matrix.architecture }}
          cache-to: type=gha,scope=multiplex-${{ matrix.architecture }},mode=max
      - name: Verify packaged tools, privilege drop and fresh web state
        run: bash docker/multiplex/smoke.sh paseo-container:check
