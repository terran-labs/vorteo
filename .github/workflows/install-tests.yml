name: Install tests

# End-to-end install tests for a commit about to be tagged. Run it by hand on that
# commit, then tag with scripts/vorteo-release.mjs. It never tags or publishes.
# See docs/release.md#install-tests.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to test"
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  # Last commit before tagged releases existed. The legacy wrap installs a standalone
  # deployment from here until a stable release exists.
  LEGACY_FALLBACK_REF: 7882361ea14bfbcac17bf9c75b1bff08ed2c7f77

jobs:
  linux:
    name: ubuntu (Dev in gate mode, then a legacy wrap)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VORTEO_E2E_STATE: ${{ github.workspace }}/.runtime/vorteo-e2e
      VORTEO_E2E_DEV_IMAGE: vorteo-dev:install-tests
      VORTEO_E2E_LEGACY_DEPLOYMENT: ${{ github.workspace }}/../legacy-deployment
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Start the runner user's systemd manager
        run: bash scripts/release/e2e/linux-user-systemd.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build the Dev image with cached layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          build-args: PASEO_BUILD_COMMIT=${{ github.sha }}
          tags: ${{ env.VORTEO_E2E_DEV_IMAGE }}
          load: true
          provenance: false
          cache-from: |
            type=gha,scope=multiplex-amd64
            type=gha,scope=install-tests
          cache-to: type=gha,scope=install-tests,mode=max

      - name: Linux project permission recovery
        run: >-
          docker run --rm --network none --mount type=volume,dst=/share
          --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/installer,dst=/checks,readonly"
          --entrypoint python3 "$VORTEO_E2E_DEV_IMAGE"
          -I /checks/projects-permissions.test.py

      - name: Install with Dev in gate mode
        run: node scripts/release/e2e/install-e2e.mjs install full
      - run: node scripts/release/e2e/install-e2e.mjs wait-ready full
      - run: node scripts/release/e2e/install-e2e.mjs assert-access full
      - run: node scripts/release/e2e/install-e2e.mjs assert-shared-projects
      - name: Dev isolation and gate log
        run: node scripts/release/e2e/install-e2e.mjs assert-gate
      - name: Uninstall before the legacy wrap
        run: node scripts/release/e2e/install-e2e.mjs uninstall

      - name: Choose the legacy source
        id: legacy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release="$(node scripts/release/latest.mjs --repository "$GITHUB_REPOSITORY")"; then
            ref="$(node -p 'JSON.parse(process.argv[1]).commit' "$release")"
          else
            code=$?
            [ "$code" = 2 ] || exit "$code"
            ref="$LEGACY_FALLBACK_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$RUNNER_TEMP/legacy-source" "$ref"

      - name: Build the legacy Dev image
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/legacy-source
          file: ${{ runner.temp }}/legacy-source/docker/base/Dockerfile
          build-args: PASEO_BUILD_COMMIT=${{ steps.legacy.outputs.ref }}
          tags: vorteo-legacy:install-tests
          load: true
          provenance: false
          cache-from: type=gha,scope=multiplex-amd64

      - name: Create and wrap a legacy standalone deployment
        run: |
          bash scripts/release/e2e/legacy-deployment.sh "${{ steps.legacy.outputs.ref }}" \
            vorteo-legacy:install-tests "$VORTEO_E2E_LEGACY_DEPLOYMENT" "$VORTEO_E2E_STATE"
          node scripts/release/e2e/install-e2e.mjs install wrap
          node scripts/release/e2e/install-e2e.mjs wait-ready wrap
          node scripts/release/e2e/install-e2e.mjs assert-identity
          node scripts/release/e2e/install-e2e.mjs assert-access wrap
          node scripts/release/e2e/install-e2e.mjs assert-shared-projects

      - name: Diagnostics
        if: failure()
        run: node scripts/release/e2e/install-e2e.mjs diagnose
      - name: Upload install diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-diagnostics-${{ runner.os }}
          path: ${{ env.VORTEO_E2E_STATE }}/diagnostics
          retention-days: 7
          if-no-files-found: warn

  upgrade-linux:
    name: ubuntu upgrade from ${{ matrix.from }} (Dev in gate mode)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The first installer release, which the oldest installations run, and the newest
        # stable release from before in-app upgrades could finish on installer-made Hosts.
        from: [release-26.11.103, release-26.11.206]
    env:
      VORTEO_E2E_STATE: ${{ github.workspace }}/.runtime/vorteo-e2e
      VORTEO_E2E_OLD_DEV_IMAGE: vorteo-old:upgrade-tests
      VORTEO_E2E_OLD_SOURCE: ${{ github.workspace }}/../old-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Start the runner user's systemd manager
        run: bash scripts/release/e2e/linux-user-systemd.sh
      - uses: docker/setup-buildx-action@v4
      - name: Check out the old release
        id: old
        run: |
          git worktree add --detach "$VORTEO_E2E_OLD_SOURCE" "${{ matrix.from }}"
          echo "commit=$(git rev-parse "${{ matrix.from }}^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Build the old release's Dev image with cached layers
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.VORTEO_E2E_OLD_SOURCE }}
          file: ${{ env.VORTEO_E2E_OLD_SOURCE }}/docker/base/Dockerfile
          build-args: PASEO_BUILD_COMMIT=${{ steps.old.outputs.commit }}
          tags: ${{ env.VORTEO_E2E_OLD_DEV_IMAGE }}
          load: true
          provenance: false
          cache-from: type=gha,scope=multiplex-amd64
      - name: Install the old release with its own installer
        run: node scripts/release/e2e/install-e2e.mjs install-release "${{ matrix.from }}" full
      - run: node scripts/release/e2e/install-e2e.mjs wait-ready full
      - name: Upgrade with this commit's installer
        run: node scripts/release/e2e/install-e2e.mjs upgrade
      - run: node scripts/release/e2e/install-e2e.mjs wait-ready full
      - run: node scripts/release/e2e/install-e2e.mjs assert-upgraded
      - run: node scripts/release/e2e/install-e2e.mjs assert-access full
      - run: node scripts/release/e2e/install-e2e.mjs assert-shared-projects
      - name: Diagnostics
        if: failure()
        run: node scripts/release/e2e/install-e2e.mjs diagnose
      - name: Upload upgrade diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-diagnostics-linux-${{ matrix.from }}
          path: ${{ env.VORTEO_E2E_STATE }}/diagnostics
          retention-days: 7
          if-no-files-found: warn

  upgrade-macos:
    name: macos upgrade from ${{ matrix.from }} (Host only, launchd)
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        from: [release-26.11.103, release-26.11.206]
    env:
      VORTEO_E2E_STATE: ${{ github.workspace }}/.runtime/vorteo-e2e
      VORTEO_E2E_OLD_SOURCE: ${{ github.workspace }}/../old-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Check out the old release
        run: git worktree add --detach "$VORTEO_E2E_OLD_SOURCE" "${{ matrix.from }}"
      - name: Install the old release with its own installer
        run: node scripts/release/e2e/install-e2e.mjs install-release "${{ matrix.from }}" host-only
      - run: node scripts/release/e2e/install-e2e.mjs wait-ready host-only
      - name: Upgrade with this commit's installer
        run: node scripts/release/e2e/install-e2e.mjs upgrade
      - run: node scripts/release/e2e/install-e2e.mjs wait-ready host-only
      - run: node scripts/release/e2e/install-e2e.mjs assert-upgraded
      - run: node scripts/release/e2e/install-e2e.mjs assert-access host-only
      - name: Diagnostics
        if: failure()
        run: node scripts/release/e2e/install-e2e.mjs diagnose
      - name: Upload upgrade diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-diagnostics-macos-${{ matrix.from }}
          path: ${{ env.VORTEO_E2E_STATE }}/diagnostics
          retention-days: 7
          if-no-files-found: warn

  macos:
    name: macos (Host only, launchd)
    # GitHub's macOS runners have no Docker, so macOS covers the Host-only path.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VORTEO_E2E_STATE: ${{ github.workspace }}/.runtime/vorteo-e2e
      VORTEO_E2E_DOCKER_LOG: ${{ github.workspace }}/.runtime/vorteo-e2e/docker-calls.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Record any Docker use
        run: bash scripts/release/e2e/docker-shim.sh "$VORTEO_E2E_DOCKER_LOG"
      - run: node scripts/release/e2e/install-e2e.mjs install host-only
      - run: node scripts/release/e2e/install-e2e.mjs wait-ready host-only
      - run: node scripts/release/e2e/install-e2e.mjs assert-access host-only
      - run: node scripts/release/e2e/install-e2e.mjs assert-no-docker
      - run: node scripts/release/e2e/install-e2e.mjs uninstall
      - name: Diagnostics
        if: failure()
        run: node scripts/release/e2e/install-e2e.mjs diagnose
      - name: Upload install diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-diagnostics-${{ runner.os }}
          path: ${{ env.VORTEO_E2E_STATE }}/diagnostics
          retention-days: 7
          if-no-files-found: warn
