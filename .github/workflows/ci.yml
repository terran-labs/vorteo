  playwright-smoke:
    name: playwright (smoke)
    needs: [changes, format, lint, typecheck, build]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.browser != 'false') && needs.changes.outputs.heavy != 'false' && needs.changes.outputs.e2e == 'false' }}
    runs-on: ubuntu-24.04
