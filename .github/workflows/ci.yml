name: CI

# Vorteo: pull requests and main pushes run the required checks and cheap Ubuntu
# unit suites. The heavy suites (Playwright, Windows and macOS, desktop, installer
# and CLI E2E) run on merge groups, manual runs, a nightly schedule and release
# tags; `changes.outputs.heavy` selects them. Merge groups run a Playwright smoke of
# core flows; the full eight-shard suite needs `changes.outputs.e2e`. A merge group's commit is the one
# that becomes main, so main pushes do not repeat them.
on:
  push:
    branches: [main]
    tags: ["release-*"]
  # Every base branch, so stacked PRs and PRs into any base get the same checks.
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

# A newer push to a pull request cancels its run still in progress. A full run
# costs about 200 runner-minutes against the org's 20 concurrent jobs.
# Vorteo: other runs finish, and each merge group has its own ref. The group
# still keeps at most one queued main run and drops older queued ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' }}
      # Heavy suites stay off pull requests and main pushes. A job reads it as
      # `heavy != 'false'`, so missing routing outputs fail open to more coverage.
      heavy: ${{ contains(fromJSON('["merge_group","workflow_dispatch","schedule"]'), github.event_name) || startsWith(github.ref, 'refs/tags/release-') }}
      # The full eight-shard Playwright suite runs nightly, on manual runs and on release
      # tags. Merge groups run the core-flow smoke instead, so a merge waits minutes, not
      # an hour or more. Read as `e2e != 'false'`, so missing outputs fail open to the full suite.
      e2e: ${{ contains(fromJSON('["workflow_dispatch","schedule"]'), github.event_name) || startsWith(github.ref, 'refs/tags/release-') }}
      # Desktop apps are out of scope while PWA releases are the only channel: the desktop
      # suites run only on manual runs. Read as `desktop_apps != 'false'`, so missing outputs fail open.
      desktop_apps: ${{ github.event_name == 'workflow_dispatch' }}
      # A Windows Host is out of scope for now, so the Windows server suites run only on
      # manual runs. Read as `windows_host != 'false'`, so missing outputs fail open.
      windows_host: ${{ github.event_name == 'workflow_dispatch' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      hub: ${{ steps.filter.outputs.hub }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      app: ${{ steps.filter.outputs.app }}
      sdk: ${{ steps.filter.outputs.sdk }}
      browser: ${{ steps.filter.outputs.browser }}
      relay: ${{ steps.filter.outputs.relay }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Commit version bumps touch every manifest; route on the substantive diff.
      - name: Ignore version-only manifest bumps
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/ci-neutralize-version-bumps.mjs "${{ github.event.pull_request.base.sha }}"

      # Other events run every contract (`full`), so only pull requests need the filter;
      # skipping it elsewhere also spares tag and scheduled runs a base to diff against.
      - name: Detect affected CI contracts
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml
          # An empty token makes the filter diff the local routing commit
          # instead of asking the API for the pull request's raw file list.
          token: ""

      - name: Test Vorteo versions and commit checks
        run: node --test scripts/vorteo-version.test.mjs scripts/vorton-version.test.mjs

      - name: Test agent lifecycle scripts and instruction budgets
        run: node --test scripts/agent-lifecycle.test.mjs scripts/agent-instructions.test.mjs scripts/vorteo-release.test.mjs

      - name: Test the Dev supervisor recovery plan
        run: node --test scripts/maintenance/dev-supervisor-recovery.test.mjs

      - name: Validate CI contracts
        run: node --test scripts/ci-workflow.test.mjs scripts/daemon-launch-contract.test.mjs scripts/sync-fdroid-changelogs.test.mjs scripts/upload-release-assets.test.mjs scripts/publish-instance-web.test.mjs scripts/dependency-cache.test.mjs scripts/heavy-job.test.mjs scripts/instance-builds.test.mjs scripts/release/latest.test.mjs

  # Heavy jobs wait for required checks so a merge group does not fill its runner
  # slots before those checks start. Keep !cancelled() in each job condition:
  # failed or skipped prerequisites must not change which suites run.
  installer-tests:
    name: installer (${{ matrix.os }})
    needs: [changes, format, lint, typecheck]
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    # macOS is the only place bash 3.2 runs install.sh.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: install.sh, prerequisites, QR and progress
        run: node --test scripts/installer/install-sh.test.mjs scripts/installer/prerequisites.test.mjs scripts/installer/qr.test.mjs scripts/installer/progress.test.mjs scripts/installer/build-output.test.mjs scripts/installer/service-path.test.mjs
      - name: Installer engine
        run: npx vitest run scripts/installer/plan.test.mjs scripts/installer/detect.test.mjs scripts/installer/apply.test.mjs scripts/installer/services.test.mjs scripts/installer/gate.test.mjs scripts/installer/host-adoption.test.mjs scripts/installer/upgrade.test.mjs

  # Vorteo's main ruleset requires the separate format and lint checks by name, so they stay
  # their own jobs; quality runs upstream's remaining lint-rule, relay and SDK steps.
  format:
    name: format
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false' || needs.changes.outputs.relay != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: node scripts/npm-retry.mjs ci

      # Explicit status checks keep independent domains running after a failure.
      # A failed step still fails quality; no continue-on-error or success shim.
      - name: Test lint rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: node --test scripts/oxlint/paseo-plugin.test.mjs

      - name: Build relay
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run build:relay

      - name: Run relay tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run test --workspace=@getpaseo/relay

      - name: Build client dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:relay && npm run build:client

      - name: Build plugin SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:plugin

      - name: Run plugin SDK tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/plugin

      - name: Run protocol tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/protocol

      - name: Run client tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/client

      - name: Run highlight tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/highlight

      - name: Typecheck client examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run typecheck:examples --workspace=@getpaseo/client

  # The locked Playwright installers do not support ubuntu-latest's Ubuntu 26.04.
  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Verify dependency patch recovery
        run: node --test scripts/postinstall-patches.test.mjs

      - name: Build server stack
        run: npm run build:server

      - name: Verify built-in plugins from built output
        run: node --test scripts/builtin-plugins-dist.test.mjs

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Run website tests
        run: npx vitest run packages/website/src --bail=1

      - name: Install website test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify website mockups
        run: npm run test:e2e --workspace=@getpaseo/website

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/protocol
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/client
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/server

  # Vorteo: heavy runs build the server stack once here and share it with the Ubuntu and
  # macOS suites. It needs only `changes`, so it runs beside the required checks without
  # delaying them, and it finishes before typecheck, which keeps its own build. Pull
  # requests and main pushes skip it; their suites build as before. A consumer that cannot
  # unpack the archive builds locally, so a failed, skipped or expired build changes no
  # routing. Windows suites build natively: their checkout converts line endings, so the
  # copied plugin, skill and shell-integration files differ from a Linux build.
  build:
    name: build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Build native app dependency
        run: npm run build --workspace=@getpaseo/expo-two-way-audio

      # A tarball keeps file modes and links, which upload-artifact does not. The list
      # covers build:server, build:app-deps and build:server-deps, including the
      # protocol validators that the protocol build generates into its source tree.
      - name: Pack server stack build
        run: >-
          tar -czf "$RUNNER_TEMP/server-stack-dist.tgz"
          packages/protocol/dist
          packages/protocol/src/generated/validation/ws-outbound.aot.ts
          packages/protocol/src/generated/validation/ws-outbound-schema-metadata.ts
          packages/protocol/codegen/generated
          packages/relay/dist
          packages/client/dist
          packages/highlight/dist
          packages/plugin/dist
          packages/server/dist
          packages/cli/dist
          packages/expo-two-way-audio/build

      - name: Upload server stack build
        uses: actions/upload-artifact@v4
        with:
          name: server-stack-dist
          path: ${{ runner.temp }}/server-stack-dist.tgz
          if-no-files-found: error
          retention-days: 1
          # The tarball is already gzipped.
          compression-level: 0

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: [changes, build]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - &server_capacity
        name: Log runner capacity
        run: |
          node -e "const os = require('node:os'); console.log(JSON.stringify({cpus: os.cpus().length, model: os.cpus()[0].model, ramGiB: os.totalmem() / 2 ** 30}))"

      - &server_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &server_node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - &server_fetch
        name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - &server_install
        name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - &server_agent_clis
        name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      # Vorteo: reuse the `build` job's output when it exists. Both steps tolerate
      # failure; the build steps that follow run unless the unpack set the flag.
      - &dist_download
        name: Download shared server stack build
        id: dist
        if: ${{ needs.build.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: server-stack-dist
          path: ${{ runner.temp }}/server-stack-dist

      - &dist_unpack
        name: Unpack shared server stack build
        if: ${{ steps.dist.outcome == 'success' }}
        continue-on-error: true
        run: tar -xzf "$RUNNER_TEMP/server-stack-dist/server-stack-dist.tgz" && echo "PASEO_PREBUILT_SERVER_STACK=1" >> "$GITHUB_ENV"

      - &server_build
        name: Build server stack
        if: ${{ env.PASEO_PREBUILT_SERVER_STACK != '1' }}
        run: npm run build:server

      - name: Run server tests
        if: ${{ (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') && needs.changes.outputs.heavy != 'false' }}
        run: npm run test --workspace=@getpaseo/server
        env: &server_test_env
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # Pull requests and main pushes skip the serial integration chain.
      - name: Run server unit tests
        if: ${{ (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') && needs.changes.outputs.heavy == 'false' }}
        run: npm run test:unit --workspace=@getpaseo/server
        env: *server_test_env

      - &server_plugin_tests
        name: Run built-in plugin tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@getpaseo/builtin-plugins

      - &server_hub_contract
        name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: npm run test:hub-cli-contract --workspace=@getpaseo/server

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: [changes, format, lint, typecheck]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') && needs.changes.outputs.heavy != 'false' && needs.changes.outputs.windows_host != 'false' }}
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server unit tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test:unit --workspace=@getpaseo/server
        env: *server_test_env

      - *server_plugin_tests
      - *server_hub_contract

  # Keep the serial integration chain off the Windows unit critical path.
  server-integration-windows:
    name: server-integration (windows-latest)
    needs: [changes, format, lint, typecheck]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') && needs.changes.outputs.heavy != 'false' && needs.changes.outputs.windows_host != 'false' }}
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server integration tests
        run: npm run test:integration --workspace=@getpaseo/server
        env: *server_test_env

  # native-recursive.ts serves darwin and win32, but windows-latest above is the only
  # runner that exercises it. macOS — the platform the reported watcher bug was on —
  # otherwise has no server-test coverage. Scoped to the observer/watcher suites to
  # bound runtime.
  server-tests-macos:
    name: server-tests (macos-15, file observation)
    needs: [changes, format, lint, typecheck, build]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false') && needs.changes.outputs.heavy != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      # These suites run server source; the dependency dist is plain JavaScript.
      - *dist_download
      - *dist_unpack

      - name: Build server dependencies
        if: ${{ env.PASEO_PREBUILT_SERVER_STACK != '1' }}
        run: npm run build:server-deps

      - name: Run file observation tests
        run: |
          npm run test:unit --workspace=@getpaseo/server -- \
            src/server/file-observer \
            src/server/workspace-git-service.observation.test.ts \
            src/server/workspace-git-service.observation.integration.test.ts \
            --bail=1

      - name: Run installation adapter contracts
        run: |
          npx vitest run --config packages/server/vitest.config.ts \
            packages/server/src/server/execution-installation/config.test.ts \
            packages/server/src/server/execution-installation/coordinator-bootstrap-systemd.test.ts \
            packages/server/src/server/execution-installation/coordinator-bootstrap-linux-process.test.ts \
            --bail=1

  desktop-tests-ubuntu:
    name: desktop-tests (ubuntu-latest)
    needs: [changes, format, lint, typecheck]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') && needs.changes.outputs.heavy != 'false' && needs.changes.outputs.desktop_apps != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps: &desktop_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Build server stack
        run: npm run build:server

      - name: Run desktop tests
        run: npm run test --workspace=@getpaseo/desktop

      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool

      - name: Install Playwright browser
        if: ${{ runner.os == 'Linux' }}
        run: npx playwright install chromium

      - name: Verify Windows daemon process control
        if: ${{ runner.os == 'Windows' }}
        run: npx vitest run packages/cli/src/commands/daemon/lifecycle.e2e.test.ts --bail=1 --maxWorkers=1 -t "Windows unbound|managed two-home"

      - name: Run desktop lifecycle E2E (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run test:e2e:lifecycle --workspace=@getpaseo/desktop
        env:
          # Match browser CI's cold Metro compile budget; assertion deadlines stay unchanged.
          E2E_METRO_WARMUP_TIMEOUT_MS: "300000"
          PASEO_DESKTOP_LIFECYCLE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-lifecycle

      - name: Upload desktop lifecycle screenshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: desktop-lifecycle
          path: ${{ runner.temp }}/desktop-lifecycle
          if-no-files-found: ignore
          retention-days: 7

      - name: Run desktop lifecycle E2E (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: npm run test:e2e:lifecycle --workspace=@getpaseo/desktop

      - name: Run desktop renderer E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:renderer --workspace=@getpaseo/desktop

      - name: Run desktop browser E2E
        if: ${{ runner.os == 'Linux' }}
        run: npm run test:e2e:browser-tabs --workspace=@getpaseo/desktop
        env:
          PASEO_DESKTOP_BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/desktop-browser-e2e

      - name: Upload desktop browser diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: desktop-browser-e2e
          path: ${{ runner.temp }}/desktop-browser-e2e
          if-no-files-found: ignore
          retention-days: 7

  desktop-tests-windows:
    name: desktop-tests (windows-latest)
    needs: [changes, format, lint, typecheck]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.desktop != 'false') && needs.changes.outputs.heavy != 'false' && needs.changes.outputs.desktop_apps != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps: *desktop_test_steps

  app-tests:
    name: app-tests
    needs: [changes, build]
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Install Playwright browsers
