    <!-- Optional font faces must not block the diagnostic bootstrap or entry execution. -->
    <link
      id="vorteo-optional-fonts"
      rel="stylesheet"
      data-href="/appearance-fonts/vorton-fonts-6e84901.css"
      media="print"
      onload="this.media = 'all'"
    />
    <script>
      // A display/network preference only: never cache authentication or message data here.
      window.__vorteoSetDataSaver = function (enabled, persist) {
        var saved = true;
        if (persist !== false) {
          try {
            localStorage.setItem("vorteo-data-saver-v1", enabled ? "on" : "off");
          } catch (_) {
            saved = false;
          }
        }
        document.documentElement.dataset.vorteoDataSaver = String(enabled);
        var fonts = document.getElementById("vorteo-optional-fonts");
        if (enabled) fonts.removeAttribute("href");
        else if (!fonts.hasAttribute("href")) fonts.href = fonts.dataset.href;
        if (window.__vorteoApplyBootBrand) window.__vorteoApplyBootBrand(window.__vorteoBootBrand);
        window.dispatchEvent(new Event("vorteo-data-saver-change"));
        return saved;
      };
      var bootSavedDataSaver = false;
      try {
        bootSavedDataSaver = localStorage.getItem("vorteo-data-saver-v1") === "on";
      } catch (_) {}
      window.__vorteoSetDataSaver(bootSavedDataSaver, false);
    </script>

    <script>
      // Installation captures this value. Translucent shortcuts must be replaced to change it.
      (() => {
        const appleHandheld =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!appleHandheld) return;
        document.documentElement.dataset.vortonIosStandalone = String(
          navigator.standalone === true,
        );
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content =
          "default";
      })();
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Keep the app shell fixed to the viewport. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles smooth text rendering in the app shell. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent white flash before React mounts */
      html,
      body {
        background-color: var(--boot-background, #222222);
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
    <script>
      // A local display-only cache restores the first paint without waiting for app code.
      try {
        var brand = JSON.parse(localStorage.getItem("vorteo-boot-brand-v1"));
        if (
          brand &&
          ["white", "rainbow", "gradient"].includes(brand.mode) &&
          [brand.start, brand.end, brand.background, brand.foreground].every(function (value) {
            return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);
          })
        ) {
          window.__vorteoBootBrand = brand;
          document.documentElement.style.setProperty("--boot-background", brand.background);
          document.documentElement.style.setProperty("--boot-ring-color", brand.foreground);
          document.documentElement.style.colorScheme =
            brand.colorScheme === "light" ? "light" : "dark";
          document.querySelector('meta[name="theme-color"]').content = brand.background;
        }
      } catch (_) {
        /* Keep the existing dark fallback when storage is unavailable. */
      }
    </script>
    <style>
      #vorton-ios-status-strip {
        display: none;
      }
      /* WebKit samples fixed backgrounds to suppress its native scroll pocket.
         11px exceeds its 10px threshold; clipping an empty element paints no pixels.
         https://zenn.dev/uakihir0/articles/260920-ios27-pwa-blur */
      html[data-vorton-ios-standalone="true"] #vorton-ios-status-strip {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 11px;
        z-index: 2147483647;
        pointer-events: none;
        /* Compact layouts set the toolbar surface; wide layouts keep the sidebar surface. */
        background-color: var(
          --vorteo-top-inset-background,
          var(--colors-surface-sidebar, #f4f4f5)
        );
        -webkit-background-clip: text;
        background-clip: text;
      }
      @media (prefers-color-scheme: dark) {
        html[data-vorton-ios-standalone="true"] #vorton-ios-status-strip {
          background-color: var(
            --vorteo-top-inset-background,
            var(--colors-surface-sidebar, #141716)
          );
        }
      }
      button,
      a,
      input,
      textarea,
      select,
      [role="button"],
      [role="link"],
      [role="textbox"],
      [role="combobox"],
      [role="tab"],
      [role="switch"],
      [role="checkbox"],
      [role="slider"],
      [role="menuitem"],
      [tabindex],
      [contenteditable="true"] {
        -webkit-app-region: no-drag !important;
      }

      /* Electron does not clip app-region rectangles to scroll viewports.
         Content-only viewports emit no window regions, including from their
         controls. Visible controls here use normal DOM hit testing.
         Use initial: Blink parses the explicit value none as no-drag. */
      [data-window-content],
      [data-window-content] * {
        -webkit-app-region: initial !important;
      }

      /* Suppress the browser's default focus outline — it appears on mouse
         clicks and looks out of place against our themed surfaces. Keep a
         themed ring for keyboard users via :focus-visible. */
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid #20744a;
        outline-offset: 2px;
      }
    </style>

    <!-- Shared duration formatter: generated by scripts/sync-boot-duration.mjs. -->
    <script id="boot-duration-format">
      function formatDuration(durationMs) {
        if (!Number.isFinite(durationMs) || durationMs < 0) {
          return "0s";
        }
        const totalSeconds = durationMs / 1000;
        if (totalSeconds < 60) {
          return `${Math.floor(totalSeconds)}s`;
        }
        const totalMinutes = Math.floor(totalSeconds / 60);
        if (totalMinutes < 60) {
          const seconds = Math.floor(totalSeconds) % 60;
          return seconds === 0 ? `${totalMinutes}m` : `${totalMinutes}m ${seconds}s`;
        }
        const hours = Math.floor(totalMinutes / 60);
        const remMinutes = totalMinutes % 60;
        return remMinutes === 0 ? `${hours}h` : `${hours}h ${remMinutes}m`;
      }
    </script>

    <div id="boot-overlay">

        <div class="boot-emblem" role="progressbar" aria-label="Loading Vorteo">
          <div class="boot-spinner" aria-hidden="true"></div>

          <div class="boot-mark" id="boot-tinted-mark" aria-hidden="true"></div>
        </div>

          <p id="boot-data-saver-feedback" role="status" hidden></p>
          <p id="boot-copy-feedback" role="status"></p>
          <textarea
            id="boot-report"
            aria-label="Sanitized connection diagnostics"
            readonly
            hidden
          ></textarea>
        </div>
      </div>
    </div>

      }
      function bootSafeExecutionMessage(message) {
        if (typeof message !== "string") return "Browser did not expose an execution message";
        var exact = [
          "Script error.",
          "Load failed",
          "Failed to fetch",
          "Importing a module script failed.",
          "Cannot convert undefined or null to object",
          "Maximum call stack size exceeded",
          "Out of memory",
        ];
        if (exact.indexOf(message) >= 0) return message;
        var prefixes = [
          "Cannot read properties of undefined",
          "Cannot read properties of null",
          "undefined is not an object",
          "null is not an object",
          "Invalid regular expression",
          "Unexpected identifier",
          "Unexpected end of input",
        ];
        for (var index = 0; index < prefixes.length; index++) {
          if (message.indexOf(prefixes[index]) === 0)
            return prefixes[index] + " (expression omitted)";
        }
        var token = /^Unexpected token ['"]([<>;:(){}\[\]=?.!,])['"]$/.exec(message);

      }
      function bootSummary() {
        return JSON.stringify(
          {
            format: "vorteo-startup-diagnostics-v1",
            diagnosticsRevision: 3,
            build: document.querySelector('meta[name="vorteo-build"]')
              ? document.querySelector('meta[name="vorteo-build"]').content
              : "not embedded",
            startupGate:
              "Local settings and themed React shell must paint; daemon authentication is a separate app stage",
            automaticChecksAfterSeconds: 15,
            dataSaver: document.documentElement.dataset.vorteoDataSaver === "true",
            byteProgress: {
              state: "unavailable_during_browser_script_transfer",
              total: null,
              received: null,
            },
            scriptElements: bootScriptElements(),
            endpointProbe: bootEndpointProbe,
            maintenance: {
              state: bootMaintenance.state,
              observedAt: bootMaintenance.observedAt,
              stale: bootMaintenance.observedAt
                ? Date.now() - bootMaintenance.observedAt > 60000
                : null,
              counts: bootMaintenance.counts,
              caveat:
                "Counts do not establish an active restart or the cause of this connection failure",
            },
            pageOrigin: window.location.origin,
            expectedOriginMatches: window.__VORTEO_EXECUTION_INSTALLATION__

              : null,
            browserOnlineHint: navigator.onLine,
            serviceWorkerControlled: !!(
              navigator.serviceWorker && navigator.serviceWorker.controller
            ),
            elapsedSeconds: Math.floor((Date.now() - bootStarted) / 1000),
            page: "HTML and diagnostic script loaded; cache freshness unknown",
            assets: bootAssets,
            styles: bootStyles,
            assetError: bootAssetError,
            bootstrapFailure: bootFailure,
            scriptResources: bootResourceTimings(),
            interfaceDownloadRetries: bootScriptRetries,
            enforcedContentPolicy: bootPolicy,
            endpoint: bootEndpoint,
            endpointFailure: bootEndpointFailure,
            websocket: "Unknown — interface has not reported a connection",
            authenticationAndHostRegistration: "Unknown — requires the app connection",
            sessionReadiness: "Unknown — requires the app connection",
          },
          null,
          2,
        );
      }
      function renderBootDiagnostics() {
        var panel = document.getElementById("boot-diagnostics");
        if (!panel) return;
        panel.replaceChildren();
        var details = document.getElementById("boot-connection-details");
        details.replaceChildren();
        var report = JSON.parse(bootSummary());
        [
          "page",
          "assets",
          "endpoint",
          "websocket",
          "authenticationAndHostRegistration",
          "sessionReadiness",
        ].forEach(function (key) {
          var row = document.createElement("p");
          var labels = {
            page: "Page",
            assets: "Interface assets",
            endpoint: "Endpoint reachability",
            websocket: "WebSocket",
            authenticationAndHostRegistration: "Authentication / host registration",
            sessionReadiness: "Session readiness",
          };
          row.textContent = labels[key] + ": " + report[key];
          row.dataset.state =
            report[key].indexOf("Passed") === 0
              ? "passed"
              : /^(Failed|Timed out)/.test(report[key])
                ? "failed"
                : /^(Checking|Waiting|Interface)/.test(report[key])
                  ? "checking"
                  : "unknown";
          (key === "page" || key === "assets" || key === "endpoint" ? panel : details).appendChild(
            row,
          );
        });
        document.getElementById("boot-elapsed").textContent =
          formatDuration(report.elapsedSeconds * 1000) +
          " elapsed" +
          (document.hidden ? " · background timers may be delayed" : "");
        if (bootStyles === "waiting" || bootStyles === "failed") {
          var styleRow = document.createElement("p");
          styleRow.dataset.state = bootStyles === "failed" ? "failed" : "checking";
          styleRow.textContent =
            bootStyles === "failed"
              ? "Interface styles: Download failed. Reload to try again."
              : "Interface styles: Waiting for layout and theme styles to apply.";
          panel.appendChild(styleRow);
        }
        var completed =
          report.scriptElements.length > 0 &&
          report.scriptElements.every(function (entry) {
            return entry.loadEventObserved;
          });
        var progress = document.getElementById("boot-progress");
        if (completed) {
          progress.max = 1;
          progress.value = 1;
        } else progress.removeAttribute("value");
        document.getElementById("boot-summary").textContent = bootAssetError
          ? "The browser reported an interface error. Review the stages below."
          : bootChecking
            ? "Checking the connection while the interface continues loading…"
            : bootEndpointProbe.state === "complete" && !bootEndpointFailure
              ? "The server answered. The interface is still starting on this device."
              : "The interface is still starting. Slow downloads can remain pending without a browser error.";
        if (bootStyles === "waiting" || bootStyles === "failed") {
          document.getElementById("boot-summary").textContent =
            bootStyles === "failed"
              ? "Interface styles could not load. Reload to try again."
              : "Loading interface styles…";
        }
        if (bootFailure) {
          document.getElementById("boot-retry-script").hidden = true;
          document.getElementById("boot-summary").textContent = bootFailure.message;
          var failureRow = document.createElement("p");
          failureRow.dataset.state = "failed";
          failureRow.textContent = "Startup: Failed. Reload after correcting the reported problem.";
          panel.prepend(failureRow);
        }
        if (bootMaintenance.state !== "not_checked") {
          var maintenance = document.createElement("p");
          maintenance.textContent =
            "Upgrade / restart status: " +
            (bootMaintenance.state === "complete"
              ? "coordinator reported " +
                bootMaintenance.counts.running +
                " running and " +
                bootMaintenance.counts.queued +
                " queued requests; component, initiation time and cause are not exposed"
              : bootMaintenance.state + "; restart activity cannot be established");
          details.appendChild(maintenance);
        }
        bootUpdateRevealOrigin();
      }
      function bootResourceError(event) {
        if (event.target instanceof HTMLScriptElement) {
          bootAssetError = { kind: "download_failed", path: bootScriptPath(event.target.src) };
          bootAssets = "Failed — interface script download failed; its execution is unverified";
          if (bootAssetError.path && bootScriptRetries === 0) {
            bootFailedScript = event.target;
            document.getElementById("boot-retry-script").hidden = false;
          }
        } else if (
          event.target instanceof HTMLLinkElement &&
          event.target.rel === "stylesheet" &&
          event.target.id !== "vorteo-optional-fonts"
        ) {
          event.target.dataset.vorteoStyleFailed = "true";
          bootStyles = "failed";
        } else if (event.target === window) {
          var name = event.error && event.error.name;
          var allowed = [
            "Error",
            "TypeError",
            "ReferenceError",
            "SyntaxError",
            "RangeError",
            "URIError",
            "EvalError",
          ];
          var safeName = allowed.indexOf(name) >= 0 ? name : "Error";
          var path = bootScriptPath(event.filename);
          bootAssetError = {
            kind: "execution_error",
            path: path,
            errorName: safeName,
            executionMessage: bootSafeExecutionMessage(
              event.error ? event.error.message : event.message,
            ),
            line: Number.isFinite(event.lineno) ? event.lineno : null,
            column: Number.isFinite(event.colno) ? event.colno : null,
          };
          bootAssets = path
            ? "Failed — interface JavaScript raised " + safeName
            : "Runtime error observed; interface source attribution is unknown";

        }
        renderBootDiagnostics();
      }
      function bootResourceLoaded(event) {
        if (event.target instanceof HTMLLinkElement) {
          delete event.target.dataset.vorteoStyleFailed;
        }
        if (
          event.target instanceof HTMLScriptElement &&
          bootScriptPath(event.target.src) &&
          !bootAssetError
        ) {
          bootLoadedScripts.add(event.target);
          bootAssets = "Interface script downloaded; waiting for app startup";
          renderBootDiagnostics();
        }
      }
      function bootPolicyViolation(event) {
        if (
          event.disposition === "enforce" &&
          ["script-src", "script-src-elem", "connect-src", "default-src"].indexOf(
            event.effectiveDirective,
          ) >= 0
        ) {
          if (bootPolicy.indexOf(event.effectiveDirective) < 0)
            bootPolicy.push(event.effectiveDirective);
          renderBootDiagnostics();
        }
      }
      window.addEventListener("error", bootResourceError, true);
      window.addEventListener("load", bootResourceLoaded, true);
      window.addEventListener("securitypolicyviolation", bootPolicyViolation);
      // A Live dev page that cannot start offers the published interface. The coordinator marks
      // live pages with its indicator; `?interface=safe` keeps this browser on the static build
      // until the owner picks Live dev again.
      (function () {
        var button = document.getElementById("boot-static");
        var reveal = function () {
          var marker = document.getElementById("vorteo-live-dev-marker");
          if (marker && marker.getAttribute("data-state") === "live") button.hidden = false;
        };
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", reveal);
        else reveal();
        button.addEventListener("click", function () {
          window.location.href = "/?interface=safe";
        });
      })();
      document.getElementById("boot-retry-script").addEventListener("click", function () {
        if (
          !bootFailedScript ||
          bootScriptRetries > 0 ||
          !bootAssetError ||
          bootAssetError.kind !== "download_failed"
        )
          return;
        bootScriptRetries++;
        this.disabled = true;
        bootAssetError = null;
        bootAssets = "Retrying the failed interface download once; this does not reload the page";

        var retry = document.createElement("script");
        Array.prototype.forEach.call(bootFailedScript.attributes, function (attribute) {

        retry.async = bootFailedScript.async;
        retry.src = bootFailedScript.src;
        bootFailedScript.replaceWith(retry);

      });
      async function bootSmallJSON(response) {
        if (!response.body || !response.body.getReader) return null;
        var reader = response.body.getReader();
        var decoder = new TextDecoder();

          size = 0;

          return null;
        } finally {
          reader.cancel().catch(function () {});
        }
      }
      async function bootCheckEndpoint(trigger) {
        if (bootFinished || bootChecking || bootEndpointProbe.attempts >= 3) return;
        if (bootEndpointProbe.completedAt && Date.now() - bootEndpointProbe.completedAt < 8000)

        bootEndpointProbe.trigger = trigger;
        bootEndpointProbe.startedAt = Date.now();
        bootEndpointProbe.completedAt = null;

        var controller = bootController;
        var started = Date.now();

          timedOut = true;

          cache: "no-store",
          credentials: "omit",
          redirect: "error",
          signal: controller.signal,

          .then(async function (response) {
            var body = response.ok ? await bootSmallJSON(response) : null;
            if (
              body &&
              [body.requested, body.queued, body.running].every(function (value) {
                return Number.isSafeInteger(value) && value >= 0;
              })
            ) {

                state: "complete",
                observedAt: Date.now(),
                counts: { requested: body.requested, queued: body.queued, running: body.running },

          })
          .catch(function () {
            bootMaintenance.state = "unavailable";
          });

          var response = await fetch("/api/installation/health", options);
          if (!response.ok) {
            bootEndpoint = "Failed — HTTP " + response.status;
            bootEndpointFailure = { kind: "http", httpStatus: response.status };
          } else {
            var body = await bootSmallJSON(response);
            if (timedOut) throw new Error("deadline");
            bootEndpoint =
              body && typeof body.installationId === "string"
                ? "Passed — installation endpoint responded; identity, daemon authentication and session remain unverified"
                : "Failed — response was not valid installation health";
            if (!body || typeof body.installationId !== "string")
              bootEndpointFailure = { kind: "invalid_response", httpStatus: response.status };
          }

          bootEndpoint = timedOut
            ? "Timed out — no complete health response after 8 seconds"
            : "Failed — network request rejected; no timeout was observed";

          if (bootEndpointFailure) bootEndpointFailure.elapsedMs = Date.now() - started;

          bootEndpointProbe.completedAt = Date.now();

      }
      var bootRevealDelay = 3000;
      var bootRevealStart = null;
      function bootUpdateRevealOrigin() {
        if (!bootRevealStart) return;
        var status = document.getElementById("boot-status");
        var emblem = status.querySelector(".boot-emblem");
        // A probe response can change the centered panel's height during the reveal.
        var top =
          status.getBoundingClientRect().top +
          parseFloat(getComputedStyle(status).paddingTop) -
          status.scrollTop;
        status.style.setProperty("--boot-emblem-y", bootRevealStart.top - top + "px");
        status.style.setProperty(
          "--boot-help-y",
          bootRevealStart.bottom - top - emblem.offsetHeight + "px",
        );
      }
      function bootRevealDiagnostics() {
        var status = document.getElementById("boot-status");
        if (status.dataset.expanded === "true") return;
        var emblem = status.querySelector(".boot-emblem");
        var before = emblem.getBoundingClientRect();
        bootRevealStart = before;
        document.getElementById("boot-help").hidden = false;
        status.dataset.expanded = "true";
        var after = emblem.getBoundingClientRect();
        status.style.setProperty("--boot-emblem-x", before.left - after.left + "px");
        status.style.setProperty("--boot-emblem-y", before.top - after.top + "px");
        status.style.setProperty("--boot-emblem-scale", String(before.width / after.width));
        status.style.setProperty("--boot-help-y", before.bottom - after.bottom + "px");
        status.dataset.revealing = "true";
      }
      function bootCheckDelay() {
        if (bootFinished || bootFailure || Date.now() - bootStarted < bootRevealDelay) return;
        if (bootEndpointProbe.attempts === 0 || bootEndpointProbe.state === "offline_deferred")
          bootCheckEndpoint("automatic");
        bootRevealDiagnostics();
      }
      function bootResumeChecks() {
        if (!document.hidden) {
          bootCheckDelay();
          renderBootDiagnostics();
        }

      var bootClock = setInterval(function () {
        bootCheckDelay();
        renderBootDiagnostics();
      }, 1000);
      var bootDelayTimer = setTimeout(bootCheckDelay, bootRevealDelay);
      window.addEventListener("online", bootResumeChecks);
      window.addEventListener("pageshow", bootResumeChecks);
      document.addEventListener("visibilitychange", bootResumeChecks);
      document.getElementById("boot-check").addEventListener("click", function () {
        bootCheckEndpoint("manual");
      });
      // The coordinator names its private recovery origin only on the canonical origin; older
      // coordinators omit it, and the link stays hidden.
      // COMPAT(recoveryOriginGlobal): added after 26.11.902; read the descriptor's recoveryOrigin
      // instead once the interface floor validates it.
      (function () {
        var recovery = window.__VORTEO_RECOVERY_ORIGIN__;
        if (typeof recovery !== "string") return;
        var url;
        try {
          url = new URL(recovery);
        } catch (error) {
          return;
        }
        if (url.protocol !== "https:" || url.origin !== recovery) return;
        if (url.origin === window.location.origin) return;
        var link = document.getElementById("boot-recovery");
        link.href = url.origin + "/";
        link.hidden = false;
      })();
      document.getElementById("boot-copy").addEventListener("click", async function () {
        var report = bootSummary();
        var feedback = document.getElementById("boot-copy-feedback");
        try {
          await navigator.clipboard.writeText(report);
          feedback.textContent =
            "Diagnostics copied. Includes this page's origin and script timing, without credentials, query strings or private session data.";
        } catch (_) {
          var area = document.getElementById("boot-report");
          area.value = report;
          area.hidden = false;
          area.focus();
          area.select();
          feedback.textContent = "Clipboard unavailable. Select and copy the report below.";
        }
      });
      function bootRenderDataSaver() {
        var enabled = document.documentElement.dataset.vorteoDataSaver === "true";
        var button = document.getElementById("boot-data-saver");
        button.setAttribute("aria-pressed", String(enabled));
      }
      document.getElementById("boot-data-saver").addEventListener("click", function () {
        var saved = window.__vorteoSetDataSaver(
          document.documentElement.dataset.vorteoDataSaver !== "true",
        );
        var feedback = document.getElementById("boot-data-saver-feedback");
        feedback.hidden = saved;
        feedback.textContent = saved
          ? ""
          : "Applied to this page only: browser storage is unavailable.";
      });

      renderBootDiagnostics();
      function bootStyleStatus(event) {
        if (event.detail === "waiting" && bootStyles === "failed") return;

        renderBootDiagnostics();
      }
      window.addEventListener("vorteo-boot-styles", bootStyleStatus);
      function bootFailed(event) {
        if (bootFinished || bootFailure) return;
        var messages = {
          "installation-origin-mismatch":
            "Installation descriptor does not belong to this origin. Open the configured installation address or reload after it is repaired.",
          "installation-invalid":
            "The installation descriptor is invalid. Reload after the installation is repaired.",
          "render-failed":
            "The interface failed during startup. Reload to try again, or copy diagnostics.",
        };
        if (
          typeof event.detail !== "string" ||
          !Object.prototype.hasOwnProperty.call(messages, event.detail)
        )
          return;

        bootRevealDiagnostics();
        renderBootDiagnostics();
      }
      window.addEventListener("vorteo-boot-failed", bootFailed);
      window.__vorteoFinishBoot = function () {
        if (bootFailure) return;
        window.removeEventListener("vorteo-boot-failed", bootFailed);
        bootFinished = true;
        window.removeEventListener("vorteo-boot-styles", bootStyleStatus);
        clearInterval(bootClock);
        clearTimeout(bootDelayTimer);
        window.removeEventListener("vorteo-data-saver-change", bootRenderDataSaver);
        window.removeEventListener("online", bootResumeChecks);
        window.removeEventListener("pageshow", bootResumeChecks);
        document.removeEventListener("visibilitychange", bootResumeChecks);
        clearTimeout(bootTimer);
        if (bootController) bootController.abort();
        window.removeEventListener("error", bootResourceError, true);
        window.removeEventListener("load", bootResourceLoaded, true);
        window.removeEventListener("securitypolicyviolation", bootPolicyViolation);
        var overlay = document.getElementById("boot-overlay");
        if (!overlay || overlay.dataset.leaving) return;
        overlay.dataset.leaving = "true";
        overlay.setAttribute("aria-hidden", "true");
        overlay.inert = true;
        overlay.style.pointerEvents = "none";
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !overlay.animate) {
          overlay.remove();
          return;
        }
        var fade = overlay.animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: 350,
          easing: "ease-out",
          fill: "forwards",
        });
        fade.finished.then(
          function () {
            overlay.remove();
          },
          function () {
            overlay.remove();
          },
        );
      };
      document.getElementById("boot-status").hidden = false;
    </script>
  </body>
